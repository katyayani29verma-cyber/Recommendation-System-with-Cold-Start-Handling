

user_model:
  kind: bayesian


  temperature: 0.7569890984566972

  prior: empirical
  prior_std: 1.0
  # Blend of the empirical covariance toward a scaled identity (conditioning).
  prior_shrinkage: 0.1

  # BALD question selection.
  n_samples: 64          # posterior samples per question
  n_candidate_pairs: 300 # random candidate pairs scored per question

calibration:
  max_pairs_per_user: 50
  # same_side: only pairs both >= or both < the positive threshold. Positive-only ALS never
  #            saw the 4-vs-5 or 2-vs-3 distinction, so these labels are not in-sample.
  # all:       every pair with different ratings (optimistic: partly in-sample).
  pair_filter: same_side
  seed: 0
